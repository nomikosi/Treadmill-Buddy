import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
}

group = 'com.codex'
version = '1.2.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.3.6')
        pluginVerifier()
    }
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The IntelliJ Platform test bootstrap references JUnit 4 classes even when
    // the tests themselves are plain JUnit 5.
    testRuntimeOnly 'junit:junit:4.13.2'
}

java {
    toolchain {
        // IntelliJ Platform 2024.2+ runs on and is compiled for Java 21;
        // verifyPluginProjectConfiguration flags anything lower.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

intellijPlatform {
    // Indexes the settings page's labels, so Settings search finds
    // "auto-pause" or "weight" and not just the page title.
    buildSearchableOptions = true
    pluginConfiguration {
        id = 'com.codex.desktreadmill'
        name = 'Treadmill Buddy'
        version = project.version
        // The description and change notes live in plugin.xml only; setting
        // them here as well let the two copies drift apart.
        ideaVersion {
            sinceBuild = '243'
            untilBuild = provider { null }
        }
        vendor {
            name = 'Nomikosi Consulting'
            email = 'hello@nomikosi.dev'
            url = 'https://github.com/nomikosi/Treadmill-Buddy'
        }
    }
    pluginVerification {
        ides {
            // recommended() follows the build target, IntelliJ IDEA Community,
            // which is not published after 2025.2. The unified IntelliJ IDEA
            // covers 2025.3 and later.
            recommended()
            select {
                it.types = [IntelliJPlatformType.IntellijIdea]
                it.sinceBuild = '253'
            }
        }
    }
    signing {
        certificateChain = providers.environmentVariable('CERTIFICATE_CHAIN')
        privateKey = providers.environmentVariable('PRIVATE_KEY')
        password = providers.environmentVariable('PRIVATE_KEY_PASSWORD')
    }
    publishing {
        token = providers.environmentVariable('PUBLISH_TOKEN')
    }
}
