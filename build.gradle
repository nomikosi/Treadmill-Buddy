import org.jetbrains.changelog.Changelog
import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'org.jetbrains.changelog' version '2.5.0'
}

group = 'com.codex'
version = '1.3.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.3.6')
        pluginVerifier()
    }
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The IntelliJ Platform test bootstrap references JUnit 4 classes even when
    // the tests themselves are plain JUnit 5.
    testRuntimeOnly 'junit:junit:4.13.2'
}

java {
    toolchain {
        // IntelliJ Platform 2024.2+ runs on and is compiled for Java 21;
        // verifyPluginProjectConfiguration flags anything lower.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

// CHANGELOG.md: plain bullet lists under "## [x.y.z]" headings, no Added/Fixed groups.
changelog {
    groups.empty()
}

intellijPlatform {
    // Indexes the settings page's labels, so Settings search finds
    // "auto-pause" or "weight" and not just the page title.
    buildSearchableOptions = true
    pluginConfiguration {
        id = 'com.codex.desktreadmill'
        name = 'Treadmill Buddy'
        version = project.version
        // One copy of each, so they can't drift apart: the description lives
        // in plugin.xml, the change notes in CHANGELOG.md, rendered from the
        // section for this version (or Unreleased, before it has one).
        changeNotes = provider {
            def item = changelog.getOrNull(project.version.toString()) ?: changelog.getUnreleased()
            changelog.renderItem(item.withHeader(false).withEmptySections(false), Changelog.OutputType.HTML) +
                    '<p><a href="https://github.com/nomikosi/Treadmill-Buddy/blob/master/CHANGELOG.md">Full changelog</a></p>'
        }
        ideaVersion {
            sinceBuild = '243'
            untilBuild = provider { null }
        }
        vendor {
            name = 'Nomikosi Consulting'
            email = 'hello@nomikosi.dev'
            url = 'https://github.com/nomikosi/Treadmill-Buddy'
        }
    }
    pluginVerification {
        ides {
            // recommended() follows the build target, IntelliJ IDEA Community,
            // which is not published after 2025.2. The unified IntelliJ IDEA
            // covers 2025.3 and later.
            recommended()
            select {
                it.types = [IntelliJPlatformType.IntellijIdea]
                it.sinceBuild = '253'
            }
        }
    }
    signing {
        certificateChain = providers.environmentVariable('CERTIFICATE_CHAIN')
        privateKey = providers.environmentVariable('PRIVATE_KEY')
        password = providers.environmentVariable('PRIVATE_KEY_PASSWORD')
    }
    publishing {
        token = providers.environmentVariable('PUBLISH_TOKEN')
    }
}
