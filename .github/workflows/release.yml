name: Release

# Publishes to JetBrains Marketplace when a version tag (v1.2.3) is pushed.
# Requires repository secrets:
#   PUBLISH_TOKEN            - JetBrains Marketplace permanent token
#   CERTIFICATE_CHAIN        - plugin signing certificate chain (PEM)
#   PRIVATE_KEY              - plugin signing private key (PEM)
#   PRIVATE_KEY_PASSWORD     - password for the private key

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail in seconds, not after a full build and verification: a missing
      # token only surfaces at publishPlugin, and missing signing secrets
      # merely skip signPlugin - which would publish an unsigned build.
      - name: Check that the publishing secrets are configured
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secrets:${missing}. Add them under Settings > Secrets and variables > Actions (names must match exactly), then re-run this workflow." >&2
            exit 1
          fi

      # Rejects a tampered or unknown gradle-wrapper.jar before anything runs it.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A tag that disagrees with build.gradle would publish one version
      # number under another's name; the Marketplace never accepts a
      # re-upload of a version, so catch it before anything is built.
      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match build.gradle version ${version}" >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build

      # The Marketplace runs the verifier after upload and can reject the
      # build then; catching a compatibility problem here keeps a broken
      # version from ever being published.
      - name: Verify plugin configuration, structure, and compatibility
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # A workflow artifact, downloadable from the run page - this workflow
      # does not create a GitHub release. Only the signed ZIP is kept; the
      # unsigned intermediate is not what users should install.
      - name: Upload the signed plugin distribution as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*-signed.zip
