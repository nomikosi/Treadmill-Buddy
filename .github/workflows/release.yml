name: Release

# Runs when a version tag (v1.2.3) is pushed: builds and verifies the plugin,
# publishes it to JetBrains Marketplace when the publishing secrets are set,
# and creates a GitHub release with the plugin ZIP and the version's notes
# from CHANGELOG.md.
# Optional repository secrets - all four, or none:
#   PUBLISH_TOKEN            - JetBrains Marketplace permanent token
#   CERTIFICATE_CHAIN        - plugin signing certificate chain (PEM)
#   PRIVATE_KEY              - plugin signing private key (PEM)
#   PRIVATE_KEY_PASSWORD     - password for the private key
# Without them the release carries the unsigned ZIP, to upload to the
# Marketplace by hand.

on:
  push:
    tags:
      - 'v*'

# Publishing uses the Marketplace token, not GitHub's, so the build job's
# token only reads the repository. Only the github-release job, which runs
# no build tools and sees no secrets, may write to it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # All four or none, decided in seconds rather than after a full build:
      # a token without the signing secrets would publish an unsigned build,
      # since missing signing secrets merely skip signPlugin.
      - name: Check the publishing secrets
        id: secrets
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -z "${missing}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${missing}" = " PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No publishing secrets: the GitHub release gets the unsigned ZIP, to upload to JetBrains Marketplace by hand."
          else
            echo "::error::Only some publishing secrets are set; missing:${missing}. Add the rest under Settings > Secrets and variables > Actions (names must match exactly), or remove them all to release without publishing." >&2
            exit 1
          fi

      # Rejects a tampered or unknown gradle-wrapper.jar before anything runs it.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A tag that disagrees with build.gradle would publish one version
      # number under another's name; the Marketplace never accepts a
      # re-upload of a version, so catch it before anything is built.
      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match build.gradle version ${version}" >&2
            exit 1
          fi

      # The Marketplace change notes and the GitHub release both come from
      # this version's section in CHANGELOG.md; without one, the release
      # would ship with the Unreleased notes or none at all.
      - name: Check that CHANGELOG.md has notes for this version
        run: |
          mkdir -p build
          ./gradlew getChangelog --project-version="${GITHUB_REF_NAME#v}" \
            --no-header --no-links --no-empty-sections --output-file=build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no notes under ## [${GITHUB_REF_NAME#v}]." >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build buildPlugin

      # The Marketplace runs the verifier after upload and can reject the
      # build then; catching a compatibility problem here keeps a broken
      # version from ever being published.
      - name: Verify plugin configuration, structure, and compatibility
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier

      - name: Sign and publish to JetBrains Marketplace
        if: steps.secrets.outputs.publish == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Exactly one ZIP per release: the signed one when the plugin was
      # published, otherwise the unsigned one.
      - name: Collect the release files
        env:
          PUBLISHED: ${{ steps.secrets.outputs.publish }}
        run: |
          mkdir -p build/release
          if [ "${PUBLISHED}" = "true" ]; then
            cp build/distributions/*-signed.zip build/release/
          else
            cp build/distributions/*.zip build/release/
          fi
          cp build/release-notes.md build/release/
          ls -l build/release

      # Downloadable from the run page, and handed to the github-release job.
      - name: Upload the release files as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/release

  # A job of its own so the only step that can write to the repository runs
  # without the build tools and the signing and publishing secrets.
  github-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: release

      - name: Create the GitHub release with the plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Treadmill Buddy ${GITHUB_REF_NAME#v}" \
            --notes-file release/release-notes.md
