name: Release

# Publishes to JetBrains Marketplace when a version tag (v1.2.3) is pushed,
# then creates a GitHub release with the signed ZIP and the version's notes
# from CHANGELOG.md.
# Requires repository secrets:
#   PUBLISH_TOKEN            - JetBrains Marketplace permanent token
#   CERTIFICATE_CHAIN        - plugin signing certificate chain (PEM)
#   PRIVATE_KEY              - plugin signing private key (PEM)
#   PRIVATE_KEY_PASSWORD     - password for the private key

on:
  push:
    tags:
      - 'v*'

# Publishing uses the Marketplace token, not GitHub's, so the build job's
# token only reads the repository. Only the github-release job, which runs
# no build tools and sees no secrets, may write to it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail in seconds, not after a full build and verification: a missing
      # token only surfaces at publishPlugin, and missing signing secrets
      # merely skip signPlugin - which would publish an unsigned build.
      - name: Check that the publishing secrets are configured
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secrets:${missing}. Add them under Settings > Secrets and variables > Actions (names must match exactly), then re-run this workflow." >&2
            exit 1
          fi

      # Rejects a tampered or unknown gradle-wrapper.jar before anything runs it.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A tag that disagrees with build.gradle would publish one version
      # number under another's name; the Marketplace never accepts a
      # re-upload of a version, so catch it before anything is built.
      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match build.gradle version ${version}" >&2
            exit 1
          fi

      # The Marketplace change notes and the GitHub release both come from
      # this version's section in CHANGELOG.md; without one, the release
      # would ship with the Unreleased notes or none at all.
      - name: Check that CHANGELOG.md has notes for this version
        run: |
          mkdir -p build
          ./gradlew getChangelog --project-version="${GITHUB_REF_NAME#v}" \
            --no-header --no-links --no-empty-sections --output-file=build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no notes under ## [${GITHUB_REF_NAME#v}]." >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build

      # The Marketplace runs the verifier after upload and can reject the
      # build then; catching a compatibility problem here keeps a broken
      # version from ever being published.
      - name: Verify plugin configuration, structure, and compatibility
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Downloadable from the run page, and handed to the github-release job.
      # Only the signed ZIP is kept; the unsigned intermediate is not what
      # users should install.
      - name: Upload the signed plugin distribution as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: |
            build/distributions/*-signed.zip
            build/release-notes.md

  # A job of its own so the only step that can write to the repository runs
  # without the build tools and the signing and publishing secrets.
  github-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: release

      - name: Create the GitHub release with the signed plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/distributions/*-signed.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Treadmill Buddy ${GITHUB_REF_NAME#v}" \
            --notes-file release/release-notes.md
